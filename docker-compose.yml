services:
  seo-agent:
    build: .
    image: seo-audit-agent:1.0.0
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    shm_size: 1gb          # Chromium needs shared memory for screenshots

